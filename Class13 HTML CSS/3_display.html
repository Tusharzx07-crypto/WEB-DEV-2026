<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .block,
    .inline,
    .inline_block {
        font-weight: bold;
        font-family: sans-serif;
    }


    /* template starts from here */
    .block {
        /* height, width, p,m,border */
        background-color: lightblue;
        display: block;
        padding: 50px;
        border: 1px solid red;
        height: 10rem;
        width: 10rem;
        margin-top: 10px;
        margin-bottom: 20px;
    }

    .inline {
        background-color: lightgreen;
        display: inline;
        padding: 50px;
        border: 5px solid rgb(1, 6, 4);
        height: 10rem;
        width: 10rem;
        margin-top: 10px;
        margin-bottom: 20px;
    }

    .inline_block {
        background-color: mediumorchid;
        display: inline-block;  
        padding: 50px;
        border: 14px solid rgb(0, 255, 234);
        height: 10rem;
        width: 10rem;
        margin-top: 10px;
        margin-bottom: 20px;
    }
</style>

<body>
<h2>hello from H2</h2>
<!--block-->
<div class="block">Hello hi how are you</div>
<div class="block">Hello hi how are you</div>
<!--inline-->
<div class="inline">I am inline</div>
<div class="inline">I am inline</div>
<!--inline block-->
<div class="inline_block">I am inline block</div>
<div class="inline">i am inline</div>
</body>

</html>
