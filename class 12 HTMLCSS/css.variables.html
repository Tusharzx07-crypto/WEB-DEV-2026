<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root {
      --primary: #3498db;
      --primary-dark: #2980b9;
      --text: red;
      --spacing: 10px;
      --radius: 8px;
      --fonts: sans-serif;
    }
    body{
        font-family: var(--fonts);
        color: var(--text);
        padding: var(--spacing);
    }
    button{
        background-color: var(--primary);
        color: white;
        padding: var(--spacing);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
    }
    button:hover{
        background-color: var(--primary-dark);
    }
    .card{
        border: 2px solid var(--primary);
        border-radius: var(--radius);
        padding: var(--spacing);
        margin-top: var(--spacing);
    }
</style>
<body>
<button>Click me</button>
<div class="Card">
    <h2>CARD TITLE</h2>
    <p>this card usses the same variables as buttons</p>

</div>
    
</body>
</html>
