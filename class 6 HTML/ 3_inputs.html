<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <!--
    Signup Form 
    
    first Name , last name -> TEXT
    Mobile -> Number , min and max , value
    email id -> email
    Password -> password 
     -->

<h1>REGISTRATION FORM</h1>
<div>
<label for="first name " >FIRST NAME</label>
<input type="text" placeholder="your first name" required>
</div>

<div>
<label for="last name  " >LAST NAME</label>
<input type="text" placeholder="your last name" required>
</div>

<div>
<label for="CAMPUS " >CAMPUS</label>
<input type="text" readonly value="sushant university" required>
</div>

<div>
<label for="email " >EMAIL</label>
<input type="email" placeholder="you@email.com" required>
</div>

<div>
<label for="password" >PASSWORD</label>
<input type="password" placeholder="*******" required>
</div>
 
<div>
    <label for="gender">Gender</label>
    <select id="gender" required>
        <option value="male">M</option>
        <option value="female">F</option>
        <option value="other">O</option>
    </select>
</div>
<div>
    <label for="mobile">
        Mobile
    </label>
    <input type="number" id="mobile" placeholder="10-digit number" min="100000000" max="999999999">
</div>

<div>
<label for="Age" >AGE</label>
<input type="number" id="Age" placeholder="enter your age">
</div>



<div>
    <label for="Date of Birth">DOB
<input type="date" id="Date of Birth" required>
    </label>
</div>

<div>
<label for="Profile_pic">Profile pic </label>
<input type="file" id="Profile_pic" required >
</div>

<div>
<button type="Submit" >Register</button>
</div>

</form>

</body>
</html>
